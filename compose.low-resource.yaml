name: comgraf-lan-light
services:
  db:
    build:
      context: docker/mysql-low-resource
      args:
        MYSQL_SERVER_VERSION: 8.4.13-1debian12
    image: comgraf-mysql:8.4-debian12-baseline
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?run scripts/prepare-low-resource.py first}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - ${MYSQL_DATA_DIR:?}:/var/lib/mysql
      - ${APP_DATA_DIR:?}/logs/mysql:/var/log/mysql
    mem_limit: 1280m
    cpus: 0.80
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [internal]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: comgraf-app:lan-low-resource
    restart: unless-stopped
    user: "${APP_UID:?}:${APP_GID:?}"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      DB_HOST: db
      DB_PORT: 3306
      DB_POOL_SIZE: 5
      DB_MAX_OVERFLOW: 1
      DB_POOL_TIMEOUT: 20
      DB_POOL_RECYCLE: 1800
      WEB_THREAD_LIMIT: 8
      WEB_LIMIT_CONCURRENCY: 16
      APP_WORKERS: 1
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_LOG_DIR: /data/logs/app
      APP_TIMEZONE: America/Tegucigalpa
      COOKIE_SECURE: 'true'
      UPLOAD_DIR: /data/uploads
      STATIC_DIR: /app/frontend/dist
      MAIL_ENCRYPTION_KEY_FILE: /data/mail-secrets/fernet.key
      MAIL_WORKER_ENABLED: 'false'
      MAIL_SYNC_INTERVAL_SECONDS: 60
      MAIL_OUTBOX_POLL_SECONDS: 5
      MAIL_COPY_POLL_SECONDS: 10
      ACCESS_LOG: 'false'
      BUILD_ID: lan-light-experiment
      TEST_MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      TEST_UPLOAD_DIR: /data/test-uploads
    volumes:
      - ${APP_DATA_DIR:?}/uploads:/data/uploads
      - ${APP_DATA_DIR:?}/test-uploads:/data/test-uploads
      - ${APP_DATA_DIR:?}/mail-secrets:/data/mail-secrets
      - ${APP_DATA_DIR:?}/logs/app:/data/logs/app
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 768m
    cpus: 0.80
    pids_limit: 128
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3)']
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [internal, web]

  https_proxy:
    image: comgraf-caddy:2.11.7-alpine
    pull_policy: never
    restart: unless-stopped
    environment:
      HTTPS_HOST: ${HTTPS_HOST:-localhost}
      HTTPS_PORT: ${HTTPS_PORT:-18443}
    ports:
      - '${HTTPS_BIND:-127.0.0.1}:${HTTPS_PORT:-18443}:443'
      - '${HTTPS_BIND:-127.0.0.1}:${HTTP_PORT:-18080}:80'
    volumes:
      - ./docker/low-resource/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    networks: [web]

networks:
  internal:
    internal: true
  web: {}

volumes:
  caddy_data:
  caddy_config:
